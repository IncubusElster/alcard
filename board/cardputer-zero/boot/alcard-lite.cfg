# Alcard Cardputer Zero v5 Lite board profile.
# Exactly one board-profile APK owns /boot/alcard.cfg; config.txt includes it.
# Root=PARTUUID and console=tty1 are configured in cmdline.txt by the installer.
# The Lite board has no BMI270/BMM150 or built-in IMX219 camera.
# /boot profile installation is currently for isolated testing; production
# updates will stage these files in inactive A/B slots, not overwrite active FAT.
[all]
dtparam=i2c_arm=on
dtparam=spi=on
dtparam=i2s=on
dtparam=audio=off
enable_uart=1
camera_auto_detect=0

# Common v5 hardware, upstream DRM ST7789 and fuel gauge.
dtoverlay=alcard-zero-v5
dtoverlay=alcard-bq27220-v5

# No IMU/magnetometer on v5 Lite:
# Do not load alcard-bmi270-bmm150 or alcard-bmi270-only.
# No onboard IMX219; camera overlays must remain opt-in.

# IR receiver/transmitter.
dtoverlay=gpio-ir,gpio_pin=13,gpio_pull=up
dtoverlay=gpio-ir-tx,gpio_pin=12

# USB OTG; physical host/slave switch remains authoritative.
dtoverlay=dwc2

# HDMI/VC4 optional; internal SPI DRM TTY is independent.
# dtoverlay=vc4-kms-v3d,cma-64
