# Alcard standard Cardputer Zero v5 board profile (alcard-board-zero-v5).
# Included exactly once by /boot/config.txt: include alcard.cfg
# Mutually exclusive with alcard-board-zero-v5-lite.
# This file is owned by the board-profile APK, not alcard-boot-zero.
# Production A/B updates must stage it into the inactive FAT slot;
# never overwrite an active BOOT partition via apk upgrade.
#
# This file contains device settings only; root=PARTUUID/UUID and console=tty1
# belong in the system image's /boot/cmdline.txt.
[all]
dtparam=i2c_arm=on
dtparam=spi=on
dtparam=i2s=on
dtparam=audio=off
enable_uart=1
camera_auto_detect=0

# Integrated M5Stack v5 board with upstream DRM panel; no legacy LCD overlay.
dtoverlay=alcard-zero-v5
dtoverlay=alcard-bq27220-v5

# Full Zero with BMI270 + BMM150; *not* valid for Zero Lite.
dtoverlay=alcard-bmi270-bmm150

# Receiver on GPIO13, transmitter on GPIO12 (Raspberry Pi stock overlays).
dtoverlay=gpio-ir,gpio_pin=13,gpio_pull=up
dtoverlay=gpio-ir-tx,gpio_pin=12

# USB OTG DWC2 with physical host/slave switch. USB gadget setup is separate.
dtoverlay=dwc2

# Full Zero camera (IMX219); enable only on a board with physical camera.
# dtoverlay=imx219

# Optional external HDMI/VC4 KMS. Not required for internal SPI DRM TTY.
# dtoverlay=vc4-kms-v3d,cma-64
