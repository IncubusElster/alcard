# Alcard / Cardputer Zero v5 / HSD20 IPS ST7789v3 SPI panel.
# This is the panel's MIPI DCS initialization sequence, NOT a microcontroller
# firmware image. Pin wiring, 320x170 mode, 35px back porch, SPI speed, reset,
# and backlight belong in alcard-boot-zero's Device Tree, not here.
#
# Source: M5Stack m5stack-linux-dtoverlays, pinned revision
#   4f7aeee9fc103ebb03d22cac476bb191ecfb321e
#   modules/st7789v-1.0/st7789v_m5stack.c
#   HSD20_IPS=1, init_display(), set_var() (90 deg), HSD20_IPS_GAMMA.
# Linux format: drivers/gpu/drm/tiny/panel-mipi-dbi.c at rpi-6.18.y.
# Board orientation, visual offset and RGB/BGR MUST be confirmed on hardware.

format_version = 1
compatible = "cardputerzero,st7789v"
panel = "ST7789v3 / HSD20 IPS / Cardputer Zero v5"

# Exit sleep, then wait (M5Stack's init_display(): mdelay(120)).
[[steps]]
command = 0x11

[[steps]]
delay_ms = 120

# 16-bit RGB565 pixels.
[[steps]]
command = 0x3A
parameters = [0x55]

# MADCTL: MV | MY. M5Stack's 90-degree landscape orientation.
# Potential glass offset is expressed in Device Tree, not here.
[[steps]]
command = 0x36
parameters = [0xA0]

# HSD20_IPS porch and gate voltages, from M5Stack init_display().
[[steps]]
command = 0xB2
parameters = [0x05, 0x05, 0x00, 0x33, 0x33]

[[steps]]
command = 0xB7
parameters = [0x75]

[[steps]]
command = 0xC2
parameters = [0x01, 0xFF]

[[steps]]
command = 0xC3
parameters = [0x13]

[[steps]]
command = 0xC4
parameters = [0x20]

[[steps]]
command = 0xBB
parameters = [0x22]

[[steps]]
command = 0xC5
parameters = [0x20]

[[steps]]
command = 0xD0
parameters = [0xA4, 0xA1]

# M5Stack HSD20_IPS_GAMMA, positive and negative curves.
[[steps]]
command = 0xE0
parameters = [0xD0, 0x05, 0x0A, 0x09, 0x08, 0x05, 0x2E, 0x44, 0x45, 0x0F, 0x17, 0x16, 0x2B, 0x33]

[[steps]]
command = 0xE1
parameters = [0xD0, 0x05, 0x0A, 0x09, 0x08, 0x05, 0x2E, 0x43, 0x45, 0x0F, 0x16, 0x16, 0x2B, 0x33]

# Display ON, then enable IPS inversion as done by M5Stack.
[[steps]]
command = 0x29

[[steps]]
command = 0x21