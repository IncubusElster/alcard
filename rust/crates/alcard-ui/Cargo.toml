[package]
name = "alcard-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
publish = false
description = "Shared tiny-skia presentation and SCTK SHM for Alcard user interfaces"
[workspace]
resolver = "2"
[dependencies]
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
wayland-client = "0.31.15"
alcard-settings-core = { path = "../alcard-settings-core" }

