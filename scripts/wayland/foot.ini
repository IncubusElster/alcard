# Alcard Pixel / Foot on Cardputer Zero (320x170 at integer scale 1).
# Foot consumes TTF via fontconfig; console PSF2 is not usable here.
font=Alcard Pixel:style=Regular:pixelsize=8:antialias=false:hinting=false
font-bold=Alcard Pixel:style=Bold:pixelsize=8:antialias=false:hinting=false
font-italic=Alcard Pixel:style=Regular:pixelsize=8:antialias=false
font-bold-italic=Alcard Pixel:style=Bold:pixelsize=8:antialias=false
line-height=8px
letter-spacing=0
pad=0x0
dpi-aware=no
initial-window-size-chars=40x21
initial-window-mode=fullscreen
box-drawings-uses-font-glyphs=yes
workers=1
term=foot

[csd]
preferred=none
size=0
border-width=0

[colors-dark]
foreground=dbe7f1
background=101720
regular0=101720
regular1=e87979
regular2=82b69b
regular3=e9ce7a
regular4=8ebce8
regular5=cba6dc
regular6=67e8f9
regular7=dbe7f1
bright0=64748b
bright1=ff8b8b
bright2=a4d9ac
bright3=ffe194
bright4=a5cfff
bright5=e6b5fa
bright6=a0f4fa
bright7=ffffff

[bell]
system=no
visual=no
